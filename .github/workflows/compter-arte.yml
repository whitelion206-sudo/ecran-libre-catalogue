name: Compter les documentaires ARTE

# Se lance seulement à la main (Actions > Compter les documentaires ARTE > Run workflow).
# Ne touche pas au catalogue : il affiche juste des chiffres.
# Version 2 : vérifie aussi la langue du son indiquée par YouTube.
on:
  workflow_dispatch:

jobs:
  compter:
    runs-on: ubuntu-latest
    steps:
      - name: Compter les vidéos ARTE de 50 min ou plus
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 - <<'FIN'
          import json, os, re, urllib.parse, urllib.request
          from collections import Counter

          CLE = os.environ["YOUTUBE_API_KEY"]
          API = "https://www.googleapis.com/youtube/v3/"

          def appel(ressource, **params):
              params["key"] = CLE
              url = API + ressource + "?" + urllib.parse.urlencode(params)
              with urllib.request.urlopen(url, timeout=30) as r:
                  return json.load(r)

          def minutes(iso):
              m = re.match(r"P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?", iso or "")
              if not m:
                  return 0
              j, h, mi, s = (int(x or 0) for x in m.groups())
              return j * 1440 + h * 60 + mi + s / 60

          # Les mêmes mots interdits que le robot du catalogue (VOST, VO, sous-titré, séries…)
          MOTS_INTERDITS = re.compile(
              r"\bvost(?:fr)?\b|\bvo\b|version originale|sous[- ]titr|bande[- ]annonce|\btrailer\b|\bteaser\b"
              r"|\bsaison\s*\d|\bs[ée]rie\s+(?:hd|tv|compl[eè]te)\b|\bs[ée]rie\b[^|]*\ben\s+entier\b|\bcompil",
              flags=re.IGNORECASE)

          chaine = appel("channels", part="contentDetails,snippet", forHandle="@arte")["items"][0]
          uploads = chaine["contentDetails"]["relatedPlaylists"]["uploads"]

          ids, page = [], None
          while True:
              p = {"part": "contentDetails", "playlistId": uploads, "maxResults": 50}
              if page:
                  p["pageToken"] = page
              rep = appel("playlistItems", **p)
              ids += [it["contentDetails"]["videoId"] for it in rep.get("items", [])]
              page = rep.get("nextPageToken")
              if not page:
                  break

          videos = []
          for i in range(0, len(ids), 50):
              rep = appel("videos", part="contentDetails,status,snippet,liveStreamingDetails",
                          id=",".join(ids[i:i + 50]))
              videos += rep.get("items", [])

          def utilisable(v):
              st, cd = v.get("status", {}), v.get("contentDetails", {})
              rr = cd.get("regionRestriction", {})
              bloque = "FR" in rr.get("blocked", []) or ("allowed" in rr and "FR" not in rr["allowed"])
              return st.get("privacyStatus") == "public" and st.get("embeddable") and not bloque

          d = lambda v: minutes(v["contentDetails"].get("duration"))
          titre = lambda v: v["snippet"]["title"]
          audio = lambda v: (v["snippet"].get("defaultAudioLanguage") or "").lower()

          base = [v for v in videos if d(v) >= 50 and utilisable(v)]
          sans_vost = [v for v in base if not MOTS_INTERDITS.search(titre(v))]
          directs = [v for v in sans_vost if "liveStreamingDetails" in v]
          reste = [v for v in sans_vost if "liveStreamingDetails" not in v]

          fr = [v for v in reste if audio(v).startswith("fr")]
          autre = [v for v in reste if audio(v) and not audio(v).startswith("fr")]
          vide = [v for v in reste if not audio(v)]
          langues = Counter(audio(v) or "non indiquée" for v in reste)

          lignes = [
              "## ARTE : vidéos de 50 min ou plus, lisibles en France",
              f"- Au départ : **{len(base)}**",
              f"- Retirées car « VOST », « VO », « sous-titré »… dans le titre : **{len(base) - len(sans_vost)}**",
              f"- Retirées car ce sont d'anciens directs (émissions, jeux) : **{len(directs)}**",
              f"- **Reste : {len(reste)}**",
              "",
              "### Langue du son indiquée par YouTube",
              f"- Français : **{len(fr)}**",
              f"- Autre langue : **{len(autre)}**",
              f"- Non indiquée : **{len(vide)}**",
              "- Détail : " + ", ".join(f"{k} = {n}" for k, n in langues.most_common()),
              "",
              "### Son dans une autre langue (toutes)",
          ]
          for v in sorted(autre, key=titre):
              lignes.append(f"- [{audio(v)}] {round(d(v))} min — {titre(v)}")
          lignes += ["", "### Langue non indiquée (30 exemples)"]
          for v in sorted(vide, key=lambda v: v["snippet"]["publishedAt"], reverse=True)[:30]:
              lignes.append(f"- {round(d(v))} min — {titre(v)}")
          lignes += ["", "### Anciens directs retirés (10 exemples)"]
          for v in directs[:10]:
              lignes.append(f"- {round(d(v))} min — {titre(v)}")

          texte = "\n".join(lignes)
          print(texte)
          resume = os.environ.get("GITHUB_STEP_SUMMARY")
          if resume:
              with open(resume, "a", encoding="utf-8") as f:
                  f.write(texte + "\n")
          FIN
