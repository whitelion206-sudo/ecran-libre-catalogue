name: Compter les films de nouvelles chaînes

# Se lance seulement à la main (Actions > Compter les films de nouvelles chaînes > Run workflow).
# Ne touche pas au catalogue : il utilise les mêmes filtres que robot.py et affiche
# combien de films chaque chaîne ajouterait (sans les films déjà dans l'appli), par genre.
on:
  workflow_dispatch:

jobs:
  compter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Compter les films
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python3 - <<'FIN'
          import json, os, sys
          from collections import Counter
          sys.path.insert(0, os.getcwd())
          import robot

          # Boxoffice Nouveautés. Les chaînes SCIENCE-FICTION et COMÉDIES (ajoutées au robot
          # mais peut-être pas encore lues) servent seulement à ne pas compter leurs films en double.
          CANDIDATES = [
              {"nom": "Boxoffice | NANARS & PÉPITES", "handle": "@BoxOfficeNanars",
               "genre": "Nanar", "vf_seulement": True},
          ]
          cle = os.environ["YOUTUBE_API_KEY"]
          exclus = robot.lire_exclus()
          with open("catalogue.json", encoding="utf-8") as f:
              deja = json.load(f).get("films", [])
          connus = {}
          for film in deja:
              connus.setdefault(robot.normalise(film.get("titre", "")), []).append(film.get("duree_minutes") or 0)
          avant = Counter(g for film in deja for g in film.get("genres", []))

          def deja_la(fiche):
              return any(abs(d - fiche["duree_minutes"]) <= 5 for d in connus.get(robot.normalise(fiche["titre"]), []))

          lignes = ["## Ce que les nouvelles chaînes ajouteraient", ""]
          gain_total = Counter()
          total_nouveaux = 0
          for chaine in CANDIDATES:
              try:
                  if chaine.get("video"):
                      rep = robot.appel_api("videos", {"part": "snippet", "id": chaine["video"]}, cle)
                      if not rep.get("items"):
                          lignes += [f"### {chaine['nom']}", "- Vidéo introuvable", ""]
                          continue
                      chaine["id"] = rep["items"][0]["snippet"]["channelId"]
                  param = {"part": "snippet,statistics"}
                  param.update({"id": chaine["id"]} if chaine.get("id") else {"forHandle": chaine["handle"]})
                  rep = robot.appel_api("channels", param, cle)
                  if not rep.get("items"):
                      lignes += [f"### {chaine['nom']}", "- Chaîne introuvable", ""]
                      continue
                  item = rep["items"][0]
                  chaine["id"] = item["id"]
                  vrai_nom = item["snippet"]["title"]
                  abonnes = int(item.get("statistics", {}).get("subscriberCount", 0))
                  presentation = " ".join(item["snippet"].get("description", "").split())[:400]
                  creee = item["snippet"].get("publishedAt", "")[:10]
                  ids = robot.videos_de_la_chaine(chaine, cle)
              except (SystemExit, Exception) as erreur:
                  lignes += [f"### {chaine['nom']}", f"- Lecture impossible : {erreur}", ""]
                  continue
              utilisables, nouveaux, exemples = 0, [], []
              for video in robot.details_des_videos(ids, cle):
                  if not robot.est_utilisable(video, exclus):
                      continue
                  if chaine.get("vf_seulement") and not robot.est_en_francais(video):
                      continue
                  if robot.sans_nom_de_film(video["snippet"].get("title", "")):
                      continue
                  utilisables += 1
                  fiche = robot.fiche_film(video, chaine)
                  if deja_la(fiche):
                      continue
                  nouveaux.append(fiche)
                  # pas de doublon entre les nouvelles chaînes elles-mêmes
                  connus.setdefault(robot.normalise(fiche["titre"]), []).append(fiche["duree_minutes"])
              if chaine.get("pour_doublons"):
                  continue
              genres = Counter(g for f in nouveaux for g in f["genres"])
              gain_total.update(genres)
              total_nouveaux += len(nouveaux)
              lignes += [f"### {vrai_nom}",
                         f"- Identifiant : {chaine['id']} · {abonnes:,} abonnés".replace(",", " "),
                         f"- Créée le : {creee}",
                         f"- Présentation de la chaîne : {presentation or '(vide)'}",
                         f"- Vidéos sur la chaîne : **{len(ids)}**",
                         f"- Films gardés par les filtres du robot : **{utilisables}**",
                         f"- **Nouveaux films (pas déjà dans l'appli) : {len(nouveaux)}**",
                         "- Par genre : " + (", ".join(f"{g} +{n}" for g, n in genres.most_common()) or "aucun"),
                         "- Exemples : " + " ; ".join(f["titre"] for f in nouveaux[:8]), ""]
          lignes += ["## Total", f"- **{total_nouveaux} nouveaux films** (catalogue actuel : {len(deja)})", "",
                     "### Genres qui grandiraient (avant → après)"]
          for g, n in sorted(gain_total.items(), key=lambda x: -x[1]):
              lignes.append(f"- {g} : {avant.get(g, 0)} → {avant.get(g, 0) + n} (+{n})")
          texte = "\n".join(lignes)
          print(texte)
          resume = os.environ.get("GITHUB_STEP_SUMMARY")
          if resume:
              with open(resume, "a", encoding="utf-8") as f:
                  f.write(texte + "\n")
          FIN
