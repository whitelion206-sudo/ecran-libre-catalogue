name: Mise à jour du catalogue

on:
  schedule:
    - cron: "17 4 * * *"      # grand passage du matin (avec recherche des bandes-annonces)
    - cron: "47 */2 * * *"    # passages rapides toutes les 2 heures (nouveaux films seulement)
  workflow_dispatch:

permissions:
  contents: write

# Deux passages ne tournent jamais en même temps : le second attend la fin du premier.
concurrency:
  group: catalogue
  cancel-in-progress: false

jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      # Toujours la dernière version de main : un passage qui attendait la fin du
      # précédent repart de ce que celui-ci vient d'enregistrer (sinon « push » refusé).
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Récupérer les films
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MAX_RECHERCHES: ${{ github.event.schedule == '47 */2 * * *' && '0' || '60' }}
        run: python3 robot.py

      - name: Enregistrer le catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue.json historique_vues.json a_corriger.txt
          git diff --cached --quiet || git commit -m "Mise à jour du catalogue"
          git push
