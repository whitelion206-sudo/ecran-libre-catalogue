name: Mise à jour du catalogue

on:
  schedule:
    - cron: "17 4 * * *"      # grand passage du matin (avec recherche des bandes-annonces)
    - cron: "47 */4 * * *"    # passages rapides toutes les 4 heures (nouveaux films seulement)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Récupérer les films
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MAX_RECHERCHES: ${{ github.event.schedule == '47 */4 * * *' && '0' || '60' }}
        run: python3 robot.py

      - name: Enregistrer le catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue.json
          git diff --cached --quiet || git commit -m "Mise à jour du catalogue"
          git push
