name: Mise à jour du catalogue

on:
  schedule:
    # Heures en temps universel (Paris = +1 h l'hiver, +2 h l'été), et GitHub démarre souvent en retard.
    - cron: "37 8 * * *"      # grand passage, juste après la remise à zéro des recherches YouTube (9 h à Paris)
    - cron: "47 */2 * * *"    # passages rapides toutes les 2 heures (nouveaux films seulement)
  workflow_dispatch:
    inputs:
      recherches:
        description: "Recherches de bandes-annonces (laisser 0 pour garder celles du grand passage)"
        default: "0"

permissions:
  contents: write

# Deux passages ne tournent jamais en même temps : le second attend la fin du premier.
concurrency:
  group: catalogue
  cancel-in-progress: false

jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      # Toujours la dernière version de main : un passage qui attendait la fin du
      # précédent repart de ce que celui-ci vient d'enregistrer (sinon « push » refusé).
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Récupérer les films
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MAX_RECHERCHES: ${{ github.event_name == 'workflow_dispatch' && inputs.recherches || (github.event.schedule == '47 */2 * * *' && '0' || '90') }}
        run: python3 robot.py

      - name: Enregistrer le catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue.json a_corriger.txt videos_ecartees.json annees.json
          # Plus d'historique des vues (règles de YouTube) : l'ancien fichier est retiré.
          git rm -q --ignore-unmatch historique_vues.json
          git diff --cached --quiet || git commit -m "Mise à jour du catalogue"
          # Si un fichier a été envoyé sur GitHub pendant le passage, l'enregistrement
          # est refusé : on récupère ces changements et on réessaie (3 fois au plus).
          for essai in 1 2 3; do
            git push && exit 0
            echo "Enregistrement refusé (fichier envoyé pendant le passage) : nouvel essai."
            sleep 5
            git pull --rebase origin main || { git rebase --abort; exit 1; }
          done
          exit 1
